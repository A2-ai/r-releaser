name: 'r-releaser prism ingestion'
description: 'Downloads release assets from a GitHub Release and uploads them to PRISM'

inputs:
  prism_api_url:
    description: 'Base URL of the PRISM API'
    required: true
  auth_token:
    description: 'Bearer token for authenticating with PRISM'
    required: true
  release_tag:
    description: 'The GitHub Release tag whose assets will be downloaded and uploaded'
    required: true
  package_name:
    description: 'Package name for API path construction and logging (defaults to repository name)'
    required: false
    default: ''
  retry_count:
    description: 'Maximum number of upload attempts per file'
    required: false
    default: '3'
  create_edition:
    description: 'Whether to create a new edition for the package'
    required: false
    default: 'false'
  latest_edition:
    description: 'Whether to include this release in the latest edition'
    required: false
    default: 'false'
  dry_run:
    description: 'If true, lists release assets without uploading'
    required: false
    default: 'false'

outputs:
  uploaded-count:
    description: 'Number of successfully uploaded assets'
    value: ${{ steps.upload.outputs.uploaded-count }}
  failed-count:
    description: 'Number of failed asset uploads'
    value: ${{ steps.upload.outputs.failed-count }}
  uploaded-assets:
    description: 'JSON array of successfully uploaded asset filenames'
    value: ${{ steps.upload.outputs.uploaded-assets }}

runs:
  using: 'composite'
  steps:
    - id: mask
      name: Mask sensitive inputs
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.auth_token }}"

    - id: download
      name: Download release assets
      if: inputs.dry_run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        RELEASE_TAG="${{ inputs.release_tag }}"
        DOWNLOAD_DIR="${RUNNER_TEMP}/deploy-release-assets"
        mkdir -p "${DOWNLOAD_DIR}"

        echo "::group::Download release assets for ${RELEASE_TAG}"
        gh release download "${RELEASE_TAG}" --dir "${DOWNLOAD_DIR}" --skip-existing
        ASSET_COUNT=$(find "${DOWNLOAD_DIR}" -maxdepth 1 -type f | wc -l | tr -d ' ')
        echo "Downloaded ${ASSET_COUNT} asset(s):"
        ls -lh "${DOWNLOAD_DIR}"
        echo "::endgroup::"

        if [ "${ASSET_COUNT}" -eq 0 ]; then
          echo "::error::No assets found in release ${RELEASE_TAG}"
          exit 1
        fi

    - id: prepare
      name: Prepare binary packages
      if: inputs.dry_run != 'true'
      shell: bash
      run: |
        set -euo pipefail
        DOWNLOAD_DIR="${RUNNER_TEMP}/deploy-release-assets"
        MANIFEST="${DOWNLOAD_DIR}/manifest.json"
        if [ ! -f "${MANIFEST}" ]; then
          echo "::error::No manifest.json found in release assets; cannot prepare binaries"
          exit 1
        else
          echo "::group::Prepare binary packages"
          node "${{ github.action_path }}/prepare-binaries.js" "${DOWNLOAD_DIR}"
          echo "::endgroup::"
        fi

    - id: list-assets
      name: List release assets (dry-run)
      if: inputs.dry_run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        RELEASE_TAG="${{ inputs.release_tag }}"
        ASSET_COUNT=$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets | length')

        if [ "${ASSET_COUNT}" -eq 0 ]; then
          echo "::error::No assets found in release ${RELEASE_TAG}"
          exit 1
        fi

        echo "::group::Dry-run: assets in release ${RELEASE_TAG}"
        gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name'
        echo "Found ${ASSET_COUNT} asset(s)."
        echo "::endgroup::"

    - id: upload
      name: Upload assets to PRISM
      if: inputs.dry_run != 'true'
      shell: bash
      run: |
        set -euo pipefail

        PRISM_API_URL="${{ inputs.prism_api_url }}"
        AUTH_TOKEN="${{ inputs.auth_token }}"
        RETRY_COUNT="${{ inputs.retry_count }}"
        DOWNLOAD_DIR="${RUNNER_TEMP}/deploy-release-assets"
        PACKAGE_NAME="${{ inputs.package_name }}"

        if [ -z "${PACKAGE_NAME}" ]; then
          PACKAGE_NAME="${GITHUB_REPOSITORY##*/}"
        fi

        UPLOAD_URL="${PRISM_API_URL}/ingest/api/packages"

        uploaded_count=0
        failed_count=0
        uploaded_assets_file="$(mktemp)"

        upload_file() {
          local file_path="$1"
          local file_name
          file_name="$(basename "${file_path}")"
          local attempt=0
          local wait_seconds=2

          # Retry policy:
          # - 2xx: success
          # - 409: idempotent success (already uploaded)
          # - 4xx (except 429): non-retryable failure
          # - 429 and non-4xx failures (e.g., 5xx/network): retry with backoff
          while [ "${attempt}" -lt "${RETRY_COUNT}" ]; do
            attempt=$((attempt + 1))
            echo "  Attempt ${attempt}/${RETRY_COUNT} for ${file_name}..."

            local response_file
            response_file=$(mktemp)
            local http_code
            http_code=$(curl --silent \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --connect-timeout 30 \
              --max-time 600 \
              -X POST \
              -H "Authorization: Bearer ${AUTH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -H "X-Filename: ${file_name}" \
              --data-binary "@${file_path}" \
              "${UPLOAD_URL}" || true)

            local response_body
            response_body=$(cat "${response_file}" 2>/dev/null || echo "")
            rm -f "${response_file}"

            if [[ "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
              echo "  Uploaded ${file_name} (HTTP ${http_code})"
              return 0
            fi

            # Treat duplicate uploads as idempotent success.
            if [ "${http_code}" = "409" ]; then
              echo "::warning::${file_name} already exists on server (HTTP 409); treating as success"
              return 0
            fi

            # Non-retryable client errors should fail fast.
            if [[ "${http_code}" =~ ^4[0-9][0-9]$ ]] && [ "${http_code}" != "429" ]; then
              echo "::error::Non-retryable upload failure for ${file_name}: HTTP ${http_code} - ${response_body}"
              return 1
            fi

            echo "::warning::Retryable upload attempt ${attempt} failed for ${file_name}: HTTP ${http_code} - ${response_body}"

            if [ "${attempt}" -lt "${RETRY_COUNT}" ]; then
              echo "  Retrying in ${wait_seconds}s..."
              sleep "${wait_seconds}"
              wait_seconds=$((wait_seconds * 2))
            fi
          done

          echo "::error::Failed to upload ${file_name} after ${RETRY_COUNT} attempt(s)"
          return 1
        }

        echo "::group::Upload assets (package: ${PACKAGE_NAME})"

        for file in "${DOWNLOAD_DIR}"/*; do
          [ -f "${file}" ] || continue
          file_name="$(basename "${file}")"

          echo "Uploading ${file_name}..."
          if upload_file "${file}"; then
            uploaded_count=$((uploaded_count + 1))
            echo "${file_name}" >> "${uploaded_assets_file}"
          else
            failed_count=$((failed_count + 1))
          fi
        done

        json_array=$(jq -R -s -c 'split("\n") | map(select(length > 0))' "${uploaded_assets_file}")
        rm -f "${uploaded_assets_file}"

        echo "::endgroup::"
        echo "Summary: ${uploaded_count} uploaded, ${failed_count} failed"

        echo "uploaded-count=${uploaded_count}" >> "${GITHUB_OUTPUT}"
        echo "failed-count=${failed_count}" >> "${GITHUB_OUTPUT}"
        echo "uploaded-assets=${json_array}" >> "${GITHUB_OUTPUT}"

        if [ "${failed_count}" -gt 0 ]; then
          echo "::error::${failed_count} asset(s) failed to upload"
          exit 1
        fi

    - id: create-edition
      name: Create edition
      if: inputs.create_edition == 'true' && inputs.dry_run != 'true' && steps.upload.outputs.failed-count == 0 && steps.upload.outputs.uploaded-count > 0
      shell: bash
      run: |
        set -euo pipefail

        PRISM_API_URL="${{ inputs.prism_api_url }}"
        AUTH_TOKEN="${{ inputs.auth_token }}"
        PACKAGE_NAME="${{ inputs.package_name }}"
        LATEST_EDITION="${{ inputs.latest_edition }}"
        RELEASE_TAG="${{ inputs.release_tag }}"

        if [ -z "${PACKAGE_NAME}" ]; then
          PACKAGE_NAME="${GITHUB_REPOSITORY##*/}"
        fi

        # Derive version from release tag (strip leading v)
        PACKAGE_VERSION="${RELEASE_TAG#v}"

        echo "::group::Create edition (package: ${PACKAGE_NAME}, version: ${PACKAGE_VERSION})"

        # 1. Ensure registry exists
        REGISTRY_ENDPOINT="${PRISM_API_URL}/registries/${PACKAGE_NAME}"
        echo "Checking if registry exists: ${REGISTRY_ENDPOINT}"

        REGISTRY_CODE=$(curl -s -w "%{http_code}" -o /tmp/registry_response.json \
          -X GET "${REGISTRY_ENDPOINT}" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${AUTH_TOKEN}")

        if [ "${REGISTRY_CODE}" -eq 404 ]; then
          echo "Registry does not exist. Creating..."
          PAYLOAD=$(jq -n '{ "registry_type": "individual package" }')

          CREATE_CODE=$(curl -s -w "%{http_code}" -o /tmp/registry_response.json \
            -X POST "${REGISTRY_ENDPOINT}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            -d "${PAYLOAD}")

          if [ "${CREATE_CODE}" = "409" ]; then
            echo "Registry already exists (HTTP 409); continuing"
          elif [ "${CREATE_CODE}" -lt 200 ] || [ "${CREATE_CODE}" -ge 300 ]; then
            echo "::error::Failed to create registry (HTTP ${CREATE_CODE})"
            cat /tmp/registry_response.json
            exit 1
          else
            echo "Registry created (HTTP ${CREATE_CODE})"
          fi
        elif [ "${REGISTRY_CODE}" -eq 200 ]; then
          echo "Registry exists"
        else
          echo "::error::Failed to check registry (HTTP ${REGISTRY_CODE})"
          cat /tmp/registry_response.json
          exit 1
        fi

        # 2. Check edition does not already exist
        EDITION_ENDPOINT="${PRISM_API_URL}/registries/${PACKAGE_NAME}/editions/${PACKAGE_VERSION}"
        echo "Checking if edition exists: ${EDITION_ENDPOINT}"

        EDITION_CODE=$(curl -s -w "%{http_code}" -o /tmp/edition_response.json \
          -X GET "${EDITION_ENDPOINT}" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${AUTH_TOKEN}")

        if [ "${EDITION_CODE}" -eq 200 ]; then
          echo "::error::Edition ${PACKAGE_VERSION} already exists"
          exit 1
        elif [ "${EDITION_CODE}" -ne 404 ]; then
          echo "::error::Failed to check edition (HTTP ${EDITION_CODE})"
          cat /tmp/edition_response.json
          exit 1
        fi

        # 3. Create the edition
        if [ "${LATEST_EDITION}" = "true" ]; then
          echo "Setting latest=true"
          EDITION_ENDPOINT="${EDITION_ENDPOINT}?latest=true"
        fi

        PAYLOAD=$(jq -n \
          --arg name "${PACKAGE_NAME}" \
          --arg version "${PACKAGE_VERSION}" \
          '{
            mutable: false,
            packages: [
              {
                name: $name,
                version: $version
              }
            ]
          }')

        echo "Posting edition to: ${EDITION_ENDPOINT}"
        echo "Payload:"
        echo "${PAYLOAD}" | jq .

        CREATE_EDITION_CODE=$(curl -s -w "%{http_code}" -o /tmp/edition_response.json \
          -X POST "${EDITION_ENDPOINT}" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${AUTH_TOKEN}" \
          -d "${PAYLOAD}")

        if [ "${CREATE_EDITION_CODE}" -lt 200 ] || [ "${CREATE_EDITION_CODE}" -ge 300 ]; then
          echo "::error::Failed to create edition (HTTP ${CREATE_EDITION_CODE})"
          cat /tmp/edition_response.json
          exit 1
        fi
        echo "Edition created successfully (HTTP ${CREATE_EDITION_CODE})"

        echo "::endgroup::"
