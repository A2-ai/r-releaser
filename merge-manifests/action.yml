name: 'r-releaser merge manifests'
description: 'Merges manifest JSON files produced by build-src and build-bin'

inputs:
  manifest_dir:
    description: 'Directory containing downloaded manifest artifacts'
    default: 'manifests'
  manifest_glob:
    description: 'Glob pattern to find manifest files within the directory'
    default: '**/manifest.json'

outputs:
  manifest_path:
    description: 'Path to the merged manifest JSON file'

runs:
  using: 'node20'
  main: 'dist/index.js'
